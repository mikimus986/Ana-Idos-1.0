<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vyhledávač spojení</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ==================================================
         VYHLEDÁVÁNÍ
    ================================================== -->

    <div class="searchBox">

        <!-- VÝCHOZÍ ZASTÁVKA -->

        <label for="from">
            Z
        </label>

        <input
            id="from"
            type="text"
            list="stops"
            autocomplete="off"
        >


        <!-- CÍLOVÁ ZASTÁVKA -->

        <label for="to">
            Do
        </label>

        <input
            id="to"
            type="text"
            list="stops"
            autocomplete="off"
        >


        <!-- SEZNAM ZASTÁVEK -->

        <datalist id="stops"></datalist>


        <!-- PROHOZENÍ -->

        <div class="swapBox">

            <button
                id="swapButton"
                type="button"
            >
                ⇅ Prohodit zastávky
            </button>

        </div>


        <!-- DATUM -->

        <label for="date">
            Datum
        </label>

        <input
            type="date"
            id="date"
        >


        <!-- ČAS -->

        <label for="time">
            Čas
        </label>

        <input
            type="time"
            id="time"
        >


        <!-- ==================================================
             REŽIM VYHLEDÁVÁNÍ
        ================================================== -->

        <div class="mode">

            <label>

                <input
                    type="radio"
                    name="mode"
                    value="departure"
                    checked
                >

                Odjezdy

            </label>


            <label>

                <input
                    type="radio"
                    name="mode"
                    value="arrival"
                >

                Příjezdy

            </label>

        </div>


        <!-- ==================================================
             TLAČÍTKO VYHLEDAT
        ================================================== -->

        <button
            id="searchButton"
            type="button"
        >
            Vyhledat spojení
        </button>

    </div>


    <!-- ==================================================
         VÝSLEDKY
    ================================================== -->

    <div id="results">

        <div class="resultCard">

            <div class="departureTime">
                Připraveno
            </div>

            <p>

                Zadejte výchozí a cílovou zastávku
                a klikněte na
                <strong>
                    Vyhledat spojení
                </strong>.

            </p>

        </div>

    </div>


    <!-- ==================================================
         SCRIPTS
    ================================================== -->

    <!-- Nejdříve search.js -->
    <script src="search.js"></script>

    <!-- Potom app.js -->
    <script src="app.js"></script>

</body>

</html>
