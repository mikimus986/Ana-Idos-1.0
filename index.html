<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jízdní řády</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">

        <h1>Vyhledávání spojení</h1>


        <!-- ========================================= -->
        <!-- VYHLEDÁVÁNÍ -->
        <!-- ========================================= -->

        <div class="searchBox">


            <!-- VÝCHOZÍ ZASTÁVKA -->

            <label for="from">
                Z výchozí zastávky
            </label>

            <input
                id="from"
                type="text"
                list="stops"
                autocomplete="off"
                placeholder="Např. Anské náměstí"
            >


            <!-- CÍLOVÁ ZASTÁVKA -->

            <label for="to">
                Do cílové zastávky
            </label>

            <input
                id="to"
                type="text"
                list="stops"
                autocomplete="off"
                placeholder="Např. Poliklinika Ansko"
            >


            <!-- NABÍDKA ZASTÁVEK -->

            <datalist id="stops"></datalist>


            <!-- PROHOZENÍ -->

            <div class="swapBox">

                <button
                    type="button"
                    id="swapButton"
                >
                    ⇅ Prohodit zastávky
                </button>

            </div>


            <!-- DATUM -->

            <label for="date">
                Datum
            </label>

            <input
                type="date"
                id="date"
            >


            <!-- ČAS -->

            <label for="time">
                Čas
            </label>

            <input
                type="time"
                id="time"
            >


            <!-- REŽIM -->

            <div class="mode">

                <label>

                    <input
                        type="radio"
                        name="mode"
                        value="departure"
                        checked
                    >

                    Odjezdy

                </label>


                <label>

                    <input
                        type="radio"
                        name="mode"
                        value="arrival"
                    >

                    Příjezdy

                </label>

            </div>


            <!-- VYHLEDAT -->

            <button
                type="button"
                id="searchButton"
            >
                Vyhledat spojení
            </button>

        </div>


        <!-- ========================================= -->
        <!-- VÝSLEDKY -->
        <!-- ========================================= -->

        <div id="results">

            <div class="resultCard">

                <div class="departureTime">
                    Připraveno
                </div>

                <p>

                    Zadejte výchozí a cílovou zastávku
                    a klikněte na
                    <strong>
                        Vyhledat spojení
                    </strong>.

                </p>

            </div>

        </div>

    </main>


    <!-- ========================================= -->
    <!-- SCRIPTS -->
    <!-- ========================================= -->

    <!-- NEJDŘÍVE SEARCH -->

    <script src="search.js"></script>


    <!-- POTOM APP -->

    <script src="app.js"></script>


</body>

</html>
