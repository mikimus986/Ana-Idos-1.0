<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vyhledávač spojení</title>
</head>

<body>

    <h1>Vyhledávač spojení</h1>


    <!-- ===================================== -->
    <!-- VYHLEDÁVÁNÍ -->
    <!-- ===================================== -->

    <div class="searchBox">

        <label for="from">
            Odkud
        </label>

        <input
            id="from"
            type="text"
            list="stops"
            autocomplete="off"
            placeholder="Výchozí zastávka"
        >


        <label for="to">
            Kam
        </label>

        <input
            id="to"
            type="text"
            list="stops"
            autocomplete="off"
            placeholder="Cílová zastávka"
        >


        <!-- Nabídka zastávek -->

        <datalist id="stops"></datalist>


        <!-- ================================= -->
        <!-- PROHOZENÍ -->
        <!-- ================================= -->

        <div class="swapBox">

            <button
                id="swapButton"
                type="button"
            >
                ⇅ Prohodit zastávky
            </button>

        </div>


        <!-- ================================= -->
        <!-- DATUM -->
        <!-- ================================= -->

        <label for="date">
            Datum
        </label>

        <input
            type="date"
            id="date"
        >


        <!-- ================================= -->
        <!-- ČAS -->
        <!-- ================================= -->

        <label for="time">
            Čas
        </label>

        <input
            type="time"
            id="time"
            value="00:00"
        >


        <!-- ================================= -->
        <!-- REŽIM -->
        <!-- ================================= -->

        <div class="mode">

            <label>

                <input
                    type="radio"
                    name="mode"
                    value="departure"
                    checked
                >

                Odjezdy

            </label>


            <label>

                <input
                    type="radio"
                    name="mode"
                    value="arrival"
                >

                Příjezdy

            </label>

        </div>


        <!-- ================================= -->
        <!-- VYHLEDAT -->
        <!-- ================================= -->

        <button
            id="searchButton"
            type="button"
        >
            Vyhledat spojení
        </button>

    </div>


    <!-- ===================================== -->
    <!-- VÝSLEDKY -->
    <!-- ===================================== -->

    <div id="results">

        <div class="resultCard">

            <div class="departureTime">
                Připraveno
            </div>

            <p>
                Zadejte výchozí a cílovou zastávku
                a klikněte na
                <strong>
                    Vyhledat spojení
                </strong>.
            </p>

        </div>

    </div>


    <!-- ===================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================== -->

    <script src="search.js"></script>

    <script src="app.js"></script>

</body>

</html>
