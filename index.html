<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana IDOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <h1>Ana IDOS</h1>
</header>

<main class="container">

<div class="searchBox">

<label>Odkud</label>
<input list="stops" id="from" placeholder="Začněte psát zastávku...">

<label>Kam</label>
<input list="stops" id="to" placeholder="Začněte psát zastávku...">

<datalist id="stops">
</datalist>

<div class="swapBox">
<button id="swapButton">⇅ Prohodit</button>
</div>

<label>Datum</label>
<input type="date" id="date">

<label>Čas</label>
<input type="time" id="time">

<div class="mode">

<label>
<input type="radio" name="mode" value="departure" checked>
Odjezdy
</label>

<label>
<input type="radio" name="mode" value="arrival">
Příjezdy
</label>

</div>

<button id="searchButton">
Vyhledat spojení
</button>

</div>

<div id="results">

</div>

</main>

<script src="app.js"></script>

</body>
</html>
