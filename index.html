<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vyhledávač spojení</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         VYHLEDÁVÁNÍ
    ================================================== -->

    <div class="searchBox">


        <!-- ==============================================
             ODKUD → KAM
        =============================================== -->

        <div class="searchRoute">


            <!-- ODKUD -->

            <div class="searchStop">

                <div class="searchStopLabel">
                    Odkud
                </div>

                <input
                    id="from"
                    type="text"
                    list="stops"
                    placeholder="Výchozí zastávka"
                    autocomplete="off"
                >

            </div>


            <!-- ŠIPKA -->

            <div class="searchArrow">
                →
            </div>


            <!-- KAM -->

            <div class="searchStop">

                <div class="searchStopLabel">
                    Kam
                </div>

                <input
                    id="to"
                    type="text"
                    list="stops"
                    placeholder="Cílová zastávka"
                    autocomplete="off"
                >

            </div>

        </div>


        <!-- ==============================================
             SEZNAM ZASTÁVEK
        =============================================== -->

        <datalist id="stops"></datalist>


        <!-- ==============================================
             PROHOZENÍ
        =============================================== -->

        <div class="swapBox">

            <button
                id="swapButton"
                type="button"
            >
                ⇅ Prohodit zastávky
            </button>

        </div>


        <!-- ==============================================
             DATUM
        =============================================== -->

        <label for="date">
            Datum
        </label>

        <input
            type="date"
            id="date"
        >


        <!-- ==============================================
             ČAS
        =============================================== -->

        <label for="time">
            Čas
        </label>

        <input
            type="time"
            id="time"
        >


        <!-- ==============================================
             ODJEZDY / PŘÍJEZDY
        =============================================== -->

        <div class="mode">


            <label>

                <input
                    type="radio"
                    name="mode"
                    value="departure"
                    checked
                >

                Odjezdy

            </label>


            <label>

                <input
                    type="radio"
                    name="mode"
                    value="arrival"
                >

                Příjezdy

            </label>


        </div>


        <!-- ==============================================
             VYHLEDAT
        =============================================== -->

        <button
            id="searchButton"
            type="button"
        >
            Vyhledat spojení
        </button>


    </div>



    <!-- ==================================================
         VÝSLEDKY
    ================================================== -->

    <div id="results">


        <!-- Výchozí karta -->

        <div class="resultCard">


            <div class="departureTime">
                Připraveno
            </div>


            <p>

                Zadejte výchozí a cílovou zastávku
                a klikněte na
                <strong>
                    Vyhledat spojení
                </strong>.

            </p>


        </div>


    </div>



    <!-- ==================================================
         SCRIPTS
    ================================================== -->

    <!-- Nejdříve vyhledávací logika -->
    <script src="search.js"></script>

    <!-- Potom aplikace -->
    <script src="app.js"></script>


</body>

                    </html>
