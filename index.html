<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana IDOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <h1>Ana IDOS</h1>
</header>

<main class="container">

    <div class="searchBox">

        <label for="from">Odkud</label>
        <input
            id="from"
            list="stops"
            placeholder="Např. Anské náměstí"
            autocomplete="off"
        >

        <label for="to">Kam</label>
        <input
            id="to"
            list="stops"
            placeholder="Např. NC Ana"
            autocomplete="off"
        >

        <datalist id="stops"></datalist>

        <div class="swapBox">
            <button id="swapButton">
                ⇅ Prohodit zastávky
            </button>
        </div>

        <label for="date">Datum</label>
        <input type="date" id="date">

        <label for="time">Čas</label>
        <input type="time" id="time">

        <div class="mode">

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="departure"
                    checked
                >
                Odjezdy
            </label>

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="arrival"
                >
                Příjezdy
            </label>

        </div>

        <button id="searchButton">
            Vyhledat spojení
        </button>

    </div>

    <div id="results">

        <div class="resultCard">

            <div class="departureTime">
                Připraveno
            </div>

            <p>
                Zadejte výchozí a cílovou zastávku a klikněte na
                <strong>Vyhledat spojení</strong>.
            </p>

        </div>

    </div>

</main>

<script src="search.js"></script>
<script src="app.js"></script>

</body>
</html>
